<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="btw">
  <!-- No text, deliberately. A wordmark is unreadable at 192px, and a glyph drawn from a
       font is a glyph that renders differently wherever the font is missing. -->
  <rect width="512" height="512" rx="116" fill="#0b0b0c"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#fafafa" stroke-width="26"/>
  <circle cx="366" cy="146" r="54" fill="#f97362"/>
</svg>
